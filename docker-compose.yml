services:

  db:
    image: postgres:15
    container_name: order_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_service

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d order_service'
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: order_service
    restart: always

    command: >
      sh -c '
        uv run alembic upgrade head &&
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      '

    depends_on:
      db:
        condition: service_healthy

    ports:
      - '8000:8000'

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: order_service

      CAPASHINO_CLIENT_URL: ${CAPASHINO_CLIENT_URL}
      CAPASHINO_API_KEY: ${CAPASHINO_API_KEY}

    volumes:
      - .:/app
      - /app/.venv

  
volumes:
  postgres_data: