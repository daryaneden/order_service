[project]
name = "order-service"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dasha", email = "koshka_1994@bk.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
order-service = "order_service:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
